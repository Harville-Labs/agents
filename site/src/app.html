<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>hl plugin</title>
    <meta
      name="description"
      content="A guide to the hl plugin for Claude Code, OpenCode, and Codex: engineering standards, workflow skills, and review subagents, built on Lauren Tan's (poteto) pstack."
    />
    <script>
      const dark = matchMedia('(prefers-color-scheme: dark)');
      const sync = () => document.documentElement.classList.toggle('dark', dark.matches);
      sync();
      dark.addEventListener('change', sync);
    </script>
    <link rel="sitemap" type="application/xml" href="%sveltekit.assets%/sitemap.xml" />
    %sveltekit.head%
  </head>
  <body class="bg-background font-sans text-foreground antialiased" data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
